#
# Linux, for scripts/pin-worktree.sh.  The object store is a bare, partial
# (blob:none) clone created on demand; each pinned commit is fetched shallow
# and checked out sparsely — only what the harnesses compile against — so a
# pin costs a few seconds and ~75 MB, and no kernel source is ever committed
# here.  Pins at the same commit share one worktree.

PROJECT_REPO="https://github.com/torvalds/linux.git"
PROJECT_STORE="inspiration/targets/linux-pins.git"
PROJECT_STORE_KIND="partial"
PROJECT_WORKTREES="inspiration/targets/linux"
PROJECT_SPARSE="lib include tools/include tools/arch tools/lib tools/scripts tools/testing/shared tools/testing/radix-tree tools/bootconfig"
PROJECT_BUILD=""

# Userspace RCU, needed by the kernel's radix-tree test harness.
URCU_PFX=${URCU_PFX:-$HOME/.local/urcu_extract/usr}

# $1 = build step.  radix-tree: build the kernel's own userspace harness
# objects (tools/testing/radix-tree) at this commit, plus an archive of its
# support objects (shared.mk's LIBS) so harness Makefiles can link whatever
# this kernel version needs without listing it.
project_build() {
  case "$1" in
    radix-tree)
      # Explicit error checks: callers run this under ||, where set -e is off.
      cd tools/testing/radix-tree || return 1
      inc="$URCU_PFX/include:$URCU_PFX/include/x86_64-linux-gnu"
      objs=$(make -s -f Makefile -f - print-objs <<'EOF2'
print-objs: ; @echo $(CORE_OFILES)
EOF2
) || return 1
      libs=$(make -s -f Makefile -f - print-libs <<'EOF2'
print-libs: ; @echo $(LIBS)
EOF2
) || return 1
      [ -n "$objs" ] && [ -n "$libs" ] || { echo "cannot read the harness object lists"; return 1; }
      C_INCLUDE_PATH="$inc" make -j"$JOBS" $objs || return 1
      rm -f libharness-support.a
      ar rcs libharness-support.a $libs || return 1 ;;
    *) echo "unknown build step: $1"; return 1 ;;
  esac
}
