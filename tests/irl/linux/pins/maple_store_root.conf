# "maple_tree: refine mas_store_root() on storing NULL".
# Harness: tests/irl/linux/maple_store_root/.
#
# Pin conversion (2026-10-19): the fixed state was red on an oracle bug —
# rule_erase_existing assumed adjacent equal-valued entries are merged and
# cleared them together (store(0,v) store(1,v) erase(0) then "expected" 1
# gone).  The maple tree only merges NULL ranges; the shadow now tracks
# which store call wrote each key and erase clears that contiguous run.
# Buggy-state red is inv_empty_iff_shadow_empty (non-empty tree after
# NULL stores).
