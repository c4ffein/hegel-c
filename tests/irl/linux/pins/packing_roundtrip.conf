#
# Our own finding (2026-07-12, FINDING_packing_le_oob_2026_07_12.md): heap
# OOB read/write in lib/packing.c pack()/unpack() via calculate_box_addr()
# — QUIRK_LITTLE_ENDIAN without QUIRK_LSW32_IS_FIRST on a buffer whose
# length is 1 or 2 mod 4 (3 mod 4 mis-addresses without leaving the buffer).
# Harness: packing_roundtrip/.
#
# buggy = v7.1.  lib/packing.c is identical on master (last change
#         2024-12, the pack_fields() series), so upstream has no fix and no
#         PIN_UPSTREAM_REF.
# fixed = v7.1 + OUR patch (packing_roundtrip.patch).  The OOB is the
#         defensible part; the physical layout the patch picks for a short
#         little-endian group (len % 4 == 3 included) follows
#         Documentation/core-api/packing.rst and still wants maintainer
#         confirmation — a round trip cannot see a symmetric mis-address.
PIN_BUGGY_REF="v7.1"
PIN_FIX_PATCH="packing_roundtrip.patch"
PIN_TESTS="test_roundtrip"
PIN_BUILD=""
