#
# 8b46fdaea819 "lib: scatterlist: fix sg_split_phys to preserve original
# offsets" (2025-03-19): sg_split_phys() reset out_sg->offset to 0 on every
# output entry but the first.  Harness: sg_split/.
#
# PIN_PATCH: test_sg_split draws partial-coverage requests, which also hit a
# second, still-unfixed bug (upstream as of v7.1, the subject of our v2
# series, patch 1/5): sg_calculate_split() decrements nb_splits twice per
# iteration but breaks only on !nb_splits, so it overshoots to -1 and folds
# the next input entry into the last split (in=[2,1], sizes={1} -> split
# length 2).  Without it the fixed state is red on that bug.  The patch is
# that one-line fix (nb_splits <= 0); it applies to both states unchanged.
# (Bug C, the ->length clobber on !NEED_SG_DMA_LENGTH, does not reach this
# test: it calls sg_split() with in_mapped_nents = n, and the mapped pass
# rewrites ->length.)
PIN_FIX_SHA="8b46fdaea819a679da176b879e7b0674a1161a5e"
PIN_PATCH="sg_split-fixed_alt.patch"
PIN_TESTS="test_sg_split"
PIN_BUILD=""
