#
# "maple_tree: fix mt_destroy_walk() on root leaf node".
# Harness: tests/irl/linux/maple_destroy_walk/.
#
# Bug: mt_destroy_walk() frees a tree whose root is a single leaf without
# marking that leaf dead, so an RCU reader still positioned on it keeps
# iterating the old contents instead of re-walking the live tree.
# Pin conversion (2026-10-19): the original rules never caught this (buggy
# state was green — nothing observed a reader across the destroy).  Added
# rule_reader_across_destroy: in RCU mode, mas_find, then mtree_destroy +
# mtree_store(k>=1) while still inside the read section, then mas_find
# again must return the new entry iff k > the reader's position.
# The rule repopulates the tree on purpose: if the tree is left EMPTY, the
# fixed kernel (and v7.1) dereferences NULL in mas_next_slot ->
# mas_rewalk_if_dead after the dead-node rewalk lands on an empty tree
# (UBSan: ma_dead_node member access within null pointer).  Same without
# destroy: RCU tree {1,3}, reader mas_find(0)=1, writer
# mtree_store_range(0, ULONG_MAX, NULL), reader mas_find -> NULL deref.
# Candidate upstream issue, unreported, not covered by any pin yet.
PIN_FIX_SHA="ea9b77f98d94c4d5c1bd1ac1db078f78b40e8bf5"
PIN_TESTS="test_maple_destroy"
PIN_BUILD="radix-tree"
PIN_DIR="maple_destroy_walk"
