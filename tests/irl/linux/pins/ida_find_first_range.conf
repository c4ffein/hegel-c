#
# Our own finding (2026-07-12, linux-ida-find-first-range):
# ida_find_first_range() searches only the first present bitmap block, so
# with IDs {0, 1024} the lowest ID in [1, 2999] comes back -ENOENT.
# Harness: idr/ (the radix-tree build), test_ida_find_first_range: the
# lowest ID in a drawn range vs a shadow, IDs over four bitmap blocks.
#
# current = v7.1, expected RED: no fix exists, ours or upstream's (lib/idr.c
# unchanged in v7.3 and linux-next as of 2026-10-22).  When one is written,
# turn this into PIN_BUGGY_REF + PIN_FIX_PATCH.
PIN_REF="v7.1"
PIN_EXPECT="red"
PIN_DIR="idr"
PIN_TESTS="test_ida_find_first_range"
PIN_BUILD="radix-tree"
# The bug, in c4ffein/bugs: linux-ida-find-first-range
PIN_BUG="bugs:1b7c75d1-a6e7-46ce-b6d9-ef4d539aebad"
