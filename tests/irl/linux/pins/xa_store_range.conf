#
# Our own finding (2026-07-12, linux-xa-store-range-ulong-max):
# xa_store_range(xa, first, ULONG_MAX, ...) never returns.  Harness:
# xarray/ (the radix-tree build), test_xa_store_range: store a drawn range,
# load both ends; a store that does not return within 250 ms is a crash
# (SIGALRM), shrunk as usual.  On v7.1 it shrinks to [0, ULONG_MAX].
#
# current = v7.1, expected RED.  No working fix yet: the one-line candidate
# (stop the tiling loop when `first` wraps, `while (first && first <= last)`)
# ends the hang but, checked 2026-11-07 with this test, leaves ULONG_MAX
# unstored for [0, ULONG_MAX]: xas_set_range() sizes that chunk 16 << 60,
# which wraps xas_size() to 0.  When a fix holds, turn this into
# PIN_BUGGY_REF + PIN_FIX_PATCH.
PIN_REF="v7.1"
PIN_EXPECT="red"
PIN_DIR="xarray"
PIN_TESTS="test_xa_store_range"
PIN_BUILD="radix-tree"
