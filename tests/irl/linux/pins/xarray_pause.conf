#
# xas_pause() skipping indices after a walk that started inside a
# multi-index entry.  Harness: xarray_pause/.
#
# buggy    = c9ba5249ef8b^: xas_pause() steps xa_index without masking
#            the bits under node->shift (the upstream bug of c9ba5249).
# fixed    = buggy + OUR patch (xarray_pause.patch), which also steps from
#            xa_index's own slot rather than xa_offset (the entry's
#            canonical slot) — see the patch header.
# upstream = c9ba5249ef8b "Xarray: move forward index correctly in
#            xas_pause()".  Masks the bits under node->shift only, so a
#            walk starting on a SIBLING slot of a multi-slot entry still
#            skips: order-1 entry at 0..1, entry at 2, walk from 1 with a
#            pause after each entry never yields 2.  Expected RED; still
#            reproduces at v7.1 (2026-10-19), no later upstream fix.
# The harness builds the radix-tree objects itself (PIN_BUILD=""): the
# kernel's own full harness build fails at these commits (lib/test_xarray.c
# was a kunit test then and needs <kunit/test.h>).
PIN_BUGGY_REF="c9ba5249ef8b080c6779d3da14a061f6d4d6d5fa^"
PIN_FIX_PATCH="xarray_pause.patch"
PIN_UPSTREAM_REF="c9ba5249ef8b080c6779d3da14a061f6d4d6d5fa"
PIN_UPSTREAM_EXPECT="red"
PIN_TESTS="test_xas_pause"
PIN_BUILD=""
