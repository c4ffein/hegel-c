#
# Chaco loader heap overflow: graphGeomLoadChac's edge-array guard is off by
# one and runs after the arc is read, so a file listing more arcs than its
# header declares writes one Gnum past edgetax (graph_io_chac.c:230).  See
# graphGeomLoadChac.patch.  Reported by the 2026-04 blind dogfood as a
# "cleanup bug"; re-hunted and pinned 2026-10-25.  Minimal file: "1 1\n1 1 1\n".
#
#   --state buggy -> PIN_BUGGY_REF                    : PIN_TESTS must FAIL
#   --state fixed -> PIN_BUGGY_REF + PIN_FIX_PATCH    : PIN_TESTS must PASS

PIN_BUGGY_REF="b4801dbf5fbe52ba57db8ae26bcd00973fb2df68"
PIN_FIX_PATCH="graphGeomLoadChac.patch"
PIN_TESTS="test_graph_geom_load_chac"
# A one-element overflow: invisible without AddressSanitizer.
PIN_ASAN=1
PIN_BUILD="scotch"
