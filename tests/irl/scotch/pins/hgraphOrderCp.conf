#
# Pin for the hgraphOrderCp off-by-ordenum bug.  Consumed by
# scripts/pin-worktree.sh (builds a Scotch worktree at the pin) and by
# `make test-pin PIN=hgraphOrderCp` in tests/irl/scotch/.
#
#   --state buggy  -> PIN_FIX_SHA^  : PIN_TESTS must FAIL and shrink small
#   --state fixed  -> PIN_FIX_SHA   : PIN_TESTS must PASS

# 064292127f79 "Bugfix: make hgraphOrderCp() work on (disconnected)
# subgraphs" (F. Pellegrini, 2026-04-15) — our report, see the header of
# test_graph_order_shrink.c.
PIN_FIX_SHA="064292127f79a394105f7bc872eb51f2c03ead2f"

# Tests that witness this bug.
PIN_TESTS="test_graph_order_shrink"

# Shrink-quality bar at --state buggy: the MINIMAL line's nvert must be
# <= this (theoretical minimum is 3).
PIN_MAX_NVERT=5

# The bug reads uninitialized heap, so with a plain fork its outcome depends
# on the parent's heap at fork time and shrinking turns nondeterministic
# (nvert=6 + caveat seen).  Fork-clean children start from a fresh exec.
PIN_ENV="HEGEL_C_FORK=clean"

# Library to link: scotch (sequential) or ptscotch (also needs mpicc).
PIN_BUILD="scotch"
