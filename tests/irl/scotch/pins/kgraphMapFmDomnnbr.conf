#
# kgraphMapFm heap over-read: the k-way FM refinement caches domnnbr, the
# number of domains, then re-maps through kgraphMapSt when the mapping is
# out of balance; that can change grafptr->m.domnnbr, and the arrays are
# reallocated with the stale count (kgraph_map_fm.c:1047), then read past
# their end in kgraphMapFmTablGet (kgraph_map_fm.c:129).  Found 2026-10-25 by
# test_graph_part_strat_fuzz; minimal case: path 0-1-2, 2 parts, strategy
# from SCOTCH_stratGraphMapBuild (SCOTCH_STRATBALANCE, 2, 0.67).
#
#   --state buggy -> PIN_BUGGY_REF                    : PIN_TESTS must FAIL
#   --state fixed -> PIN_BUGGY_REF + PIN_FIX_PATCH    : PIN_TESTS must PASS

# b4801dbf "Generate documentation for v7.0.17" (master, 2026-10-05).
PIN_BUGGY_REF="b4801dbf5fbe52ba57db8ae26bcd00973fb2df68"
PIN_FIX_PATCH="kgraphMapFmDomnnbr.patch"
PIN_TESTS="test_graph_part_strat_fuzz"
# An over-read: invisible without AddressSanitizer.
PIN_ASAN=1
PIN_BUILD="scotch"
