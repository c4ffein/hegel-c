#
# Scotch, for scripts/pin-worktree.sh.  The object store is the full clone
# `make inspiration` makes; pins build Scotch in their own worktree with the
# clone's src/Makefile.inc.

PROJECT_REPO="https://gitlab.inria.fr/scotch/scotch.git"
PROJECT_STORE="inspiration/targets/scotch"
PROJECT_STORE_KIND="clone"
PROJECT_WORKTREES="inspiration/targets/scotch"
PROJECT_BUILD="scotch"

# $1 = build step: a Scotch make target (scotch, ptscotch).  Runs in the
# worktree; $ASAN=1 adds AddressSanitizer (link the tests with it too).
project_build() {
  main="$REPO_ROOT/$PROJECT_STORE"
  [ -f "$main/src/Makefile.inc" ] || {
    echo "$main/src/Makefile.inc missing — copy one from $main/src/Make.inc/ first"; return 1; }
  cp "$main/src/Makefile.inc" src/Makefile.inc
  if [ "$ASAN" = 1 ]; then
    sed -i -e 's/^\(CFLAGS[[:space:]]*=.*\)/\1 -fsanitize=address -fno-omit-frame-pointer -g/' \
           -e 's/^\(LDFLAGS[[:space:]]*=.*\)/\1 -fsanitize=address/' src/Makefile.inc
  fi
  make -C src -j"$JOBS" "$1"
}
