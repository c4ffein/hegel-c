# SPDX-License-Identifier: MIT
# Copyright (c) 2026 c4ffein
# Part of hegel-c — see hegel/LICENSE for terms.
#
# Runs: each time we pointed hegel-c (and the bughunt skill) at bugs and
# recorded what it found. The question it answers: does a newer hegel-c,
# libhegel, skill or model still find what an older one found?
# c4ffein/bugs (private) says what each bug is; this file says which runs found
# it, naming a bug as bugs:<uuid> (the slug next to it, in a comment, is for
# reading). Until 2026-11-07 they were finding ids in docs/findings.toml.
#
# View it:   make runs              (targets x runs table, regressions flagged)
# Check it:  make lint-runs         (tools/runs.py; also checks docs/corpus.toml)
#
# This file names bugs: blind bug-hunt sandboxes must never see it, nor
# docs/runs/ (scripts/setup-bughunt-sandbox.sh copies an allow-list).
#
# [[run]] fields (required first):
#   id        <date>-<what>, kebab-case, stable
#   date      YYYY-MM-DD
#   kind      blind-recall | harness | pins | hunt
#               blind-recall  agents write harnesses from scratch for known
#                             targets without being told the bug, then an
#                             informed judge grades them
#               harness       existing harnesses run on the buggy state only
#               pins          make test-pins: buggy red AND fixed green
#               hunt          fresh hunting, no known target (results empty;
#                             what it turned up goes in `found`)
#   project   linux | scotch
#   summary   one line
# Optional:
#   blind     clean | leaked     (required for blind-recall: did a hint about
#                                 the bug reach the hunters?)
#   baseline  id of the run this one repeats
#   hegel_c   hegel-c commit it ran on      libhegel   engine version
#   model     model of the agents           skill      skill commit
#   dir       docs/runs/<id>: report, briefs, anything needed to re-run it
#   found     [bugs:<uuid>] it turned up, targeted or not (withdrawn ones too:
#             a false positive is a result)
#   notes
#
# [[run.result]] — one per target:
#   target        a fixed_by SHA from docs/corpus.toml, a bugs:<uuid>, or a pin
#                 file (tests/irl/<p>/pins/x.conf)
#   verdict       blind-recall, harness:
#                   hit | partial | miss | false-positive
#                   (false-positive: reported a bug that isn't one, and missed)
#                 pins:
#                   as-expected | unexpected
#   blind_credit  blind-recall only: the judge counts the hit as blind (no
#                 leaked hint, no nudge). Leave out when nobody judged it.
#   note
#
# A target that was a hit (or as-expected) in a run and is not in a later run
# of the same kind is a regression: `make runs` flags it. That is data, not a
# lint error.
#
# Caveats when comparing runs: one attempt per target is noisy; models read
# public fix commits after their cutoff, so later blind hits on old fixes are
# worth less (record `model`); a leaked hint voids blind credit.

