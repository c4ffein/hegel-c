#
# Rediscovery targets: bugs our hunting should be able to find again.
# Upstream-fixed bugs are keyed by their fix commit; bugs hegel-c found itself
# point at their entry in docs/findings.toml. docs/runs.toml records what each
# run found, per target; docs/rediscovery-corpus.md explains how targets are
# picked and how this file merges with sashiko's corpus.
#
# View it:   make runs              (targets x runs)
# Check it:  make lint-findings     (also checks this file)
#
# This file describes bugs: blind bug-hunt sandboxes must never see it.
# tools/merge-corpus.py hands hunters only fixed_by, subsystem, tier,
# harness_dir and status; every other field is judge-only.
#
# [[target]] fields (required first):
#   fixed_by    upstream fix commit (12+ hex)       } exactly one of the two
#   finding     id in docs/findings.toml (our find)  }
#   title       one line
#   subsystem   e.g. lib/maple_tree
#   classes     [leak | uaf | double-free | oob | overflow | off-by-one |
#                uninit | null-deref | hang | wrong-result | error-path]
#   provenance  curated | found
#   tier        A | B | C    (harnessing effort: A lib-like, C needs real shims)
#   status      candidate      picked, no harness or not hunted yet
#               rediscovered   a blind hunt found it, and the harness is red
#                              on buggy, green on fixed
#               harness-only   a harness discriminates, but no hunt found it
#                              blind (hint leaked, artifact, rules added later)
#               missed         a harness exists but never reaches the bug
#               found-novel / found-and-submitted
#                              our own find, not yet reported / reported
#                              (mirrors the finding's status)
# Optional:
#   fixed       YYYY-MM-DD of the fix          author   who fixed it
#   source      where we found it (git log, a syzbot URL)
#   harness_dir tests/irl/<project>/<dir>      pin   its pin file
#   effort      ready | small | medium | large (to build a harness, at pick time)
#   mechanism   what goes wrong (for findings: see docs/findings.toml)
#   harness     how a harness can reach it
#   property    what a test should check
#   why         why it's a good target
#   notes

# ------------------------------------------------------- round 1 (2026-05) ----

[[target]]
fixed_by = "c6e8e595a079"
title = "idr_alloc() returns an ID outside the requested range"
subsystem = "lib/idr"
classes = ["wrong-result"]
provenance = "curated"
tier = "A"
status = "rediscovered"
fixed = "2025-11-28"
author = "Matthew Wilcox"
source = "git log"
harness_dir = "tests/irl/linux/idr_rediscovery"
pin = "tests/irl/linux/pins/idr_rediscovery.conf"
effort = "ready"
mechanism = """When an IDR is initialised with a non-zero base and the caller \
requests an [lo, hi] range that lies entirely below the base, idr_get_free() \
computes max - base as a huge unsigned value and returns an ID outside the \
range. Repro: idr_alloc(0, 1) on an IDR_INIT_BASE(idr, 1) instance should \
return -ENOSPC, and returned an out-of-range ID."""
property = "every returned id satisfies lo <= id < hi"
why = """A trivial repro shape in code the harness already compiles: the smoke \
test of the whole method. If we miss this, something is wrong."""
notes = "Also in sashiko's corpus (the one overlap)."

[[target]]
fixed_by = "1fd8bc7cd889"
title = "mas_alloc_cyclic() second call does not reset the maple state"
subsystem = "lib/maple_tree"
classes = ["wrong-result"]
provenance = "curated"
tier = "A"
status = "rediscovered"
fixed = "2024-12-14"
author = "Yang Erkun"
source = "git log"
harness_dir = "tests/irl/linux/maple_tree_rediscovery"
pin = "tests/irl/linux/pins/maple_tree_rediscovery.conf"
effort = "ready"
mechanism = """mas_alloc_cyclic() calls mas_empty_area() twice (the preferred \
range, then the full range). The first call may leave the state EBUSY; \
without a mas_reset() the second returns false although a slot is free. \
Repro: fill a cyclic allocator near-full, free a low index, allocate: should \
succeed, failed with EBUSY. User-visible as tmpfs simple_offset_add() \
reporting "Device or resource busy" with thousands of free slots."""
harness = "a stateful sequence of alloc / free(id) / check_empty(range)"
property = "allocation succeeds whenever the range has a free slot"
why = """Sequence shrinking on a real stateful target: the minimal sequence \
should land on near-full + free-low + alloc."""

[[target]]
fixed_by = "94824ac9a8aa"
title = "ext4 do_split() off-by-one in the directory hash split"
subsystem = "fs/ext4"
classes = ["off-by-one"]
provenance = "curated"
tier = "C"
status = "candidate"
fixed = "2025-04-04"
author = "Artem Sadovnikov"
source = "git log (found by syzkaller)"
effort = "medium"
mechanism = """When splitting a directory hash block, the loop \
for (i = count-1; i >= 0; i--) can run down to -1 and the code after it \
computes a bad split index, leading to an out-of-bounds write in \
ext4_insert_dentry() (a 251-byte memcpy past the dx block). Reachable via \
symlink() into a directory whose hash distribution takes the early exit."""
harness = """do_split() is a pure function over an in-memory dx_map: extract it \
with a dx-entry array mock and a per-entry size array; no mount needed \
(~5-7 h)."""
property = "the split index stays in [0, count]"
why = "A classic off-by-one PBT should nail, in a high-value filesystem."

[[target]]
fixed_by = "39ebc8d7f561"
title = "xbc_verify_tree() names the wrong node in its unclosed-brace error"
subsystem = "lib/bootconfig"
classes = ["wrong-result"]
provenance = "curated"
tier = "A"
status = "harness-only"
fixed = "2026-03-12"
author = "Josh Law"
source = "git log"
harness_dir = "tests/irl/linux/bootconfig_rediscovery"
pin = "tests/irl/linux/pins/bootconfig_rediscovery.conf"
effort = "small"
mechanism = """xbc_verify_tree() reports an unclosed brace using \
open_brace[brace_index], but __xbc_open_brace() post-increments, so the index \
is one past the last pushed entry: the error message names a stale node. The \
bug is in what the diagnostic says, not in what the parser accepts."""
harness = """bootconfig is a self-contained text parser: compile lib/bootconfig.c \
into a stub harness and drive xbc_init() with generated KEY=VALUE text with \
{ } nesting (the grammar generator is the work)."""
property = "an error message always names the node that is actually unclosed"
why = """A text-grammar target, and a diagnostic-content bug: a property that \
only checks that an error exists misses it (the May run did)."""
notes = "First of a three-patch series: 39ebc8d7f561, 1120a36bb1e9, 560f763baa0f."

