[[target]]
fixed_by = "3bd5e45c2ce3"
title = "UDF lengthAllocDescs out-of-bounds read during extent truncation"
subsystem = "fs/udf"
classes = ["oob"]
provenance = "curated"
tier = "C"
status = "candidate"
fixed = "2025-09-22"
author = "Larshin Sergey"
source = "syzbot https://syzkaller.appspot.com/bug?extid=8743fca924afed42f93e"
effort = "medium"
mechanism = """In an Allocation Extent Descriptor, the on-disk lengthAllocDescs \
