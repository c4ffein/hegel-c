[[target]]
fixed_by = "8c2f1288250a"
title = "mpi_read_raw_from_sgl() integer underflow on leading zeros"
subsystem = "lib/crypto/mpi"
classes = ["overflow", "uninit"]
provenance = "curated"
tier = "A"
status = "candidate"
fixed = "2026-04-12"
author = "Lukas Wunner"
source = "git log"
effort = "small"
mechanism = """mpi_read_raw_from_sgl(nbytes, sgl) counts leading zero bytes \
walking the scatterlist, then computes nbytes - lzeros unsigned. When the \
scatterlist is longer than nbytes and its first nbytes + 1 bytes are zero, \
lzeros exceeds nbytes and the subtraction underflows into a huge size. \
Reachable via KEYCTL_PKEY_ENCRYPT with out_len > in_len and an all-zero \
input: a soft-lockup DoS."""
harness = "a minimal scatterlist mock (the scatterlist harness has stubs), ~5-7 h"
property = "returns a valid MPI or an error, never an oversized allocation"

[[target]]
