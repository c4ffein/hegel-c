notes = "The harness builds only the non-SMP group_cpus_evenly() (the SMP path, where the reported crash was, needs topology stubs); the fix patches both. Written knowing the bug, so never a blind hit. A first try in May 2026 stalled on the SMP stubs."

[[target]]
fixed_by = "ea9b77f98d94"
title = "mt_destroy_walk() frees a root leaf without marking it dead"
subsystem = "lib/maple_tree"
classes = ["uaf"]
provenance = "curated"
tier = "A"
status = "harness-only"
fixed = "2025-06-24"
author = "Wei Yang"
source = "git log"
harness_dir = "tests/irl/linux/maple_destroy_walk"
pin = "tests/irl/linux/pins/maple_destroy_walk.conf"
effort = "ready"
mechanism = """mt_destroy_walk() should mark every node dead before freeing it. \
When the whole tree is one root leaf, the descend step is skipped and the \
leaf is freed unmarked; RCU readers then see a freed node that isn't marked \
dead. The fix marks it before goto free_leaf."""
property = "a node is marked dead before call_rcu frees it"
why = """A race whose symptom needs threads, but whose invariant doesn't: hold \
rcu_read_lock across the destroy and check the mark."""

