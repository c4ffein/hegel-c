[[target]]
fixed_by = "df831e977394"
title = "group_cpus_evenly() dereferences ZERO_SIZE_PTR when numgrps = 0"
subsystem = "lib/group_cpus"
classes = ["null-deref"]
provenance = "curated"
tier = "A"
status = "harness-only"
fixed = "2025-06-19"
author = "Yu Kuai"
source = "git log"
harness_dir = "tests/irl/linux/group_cpus"
pin = "tests/irl/linux/pins/group_cpus.conf"
effort = "small"
mechanism = """kcalloc(numgrps, ...) returns ZERO_SIZE_PTR for numgrps == 0 and \
the result is dereferenced. Repro: echo 0 > poll_queues on a null_blk device. \
