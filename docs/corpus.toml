[[target]]
fixed_by = "b6b592275aef"
title = "HFS+ uninitialized read via an undersized catalog record"
subsystem = "fs/hfsplus"
classes = ["uninit"]
provenance = "curated"
tier = "C"
status = "candidate"
fixed = "2026-03-07"
author = "Deepanshu Kartikey"
source = "syzbot https://syzkaller.appspot.com/bug?extid=d80abb5b890d39261e72"
effort = "medium"
mechanism = """hfs_brec_read() checks entrylength <= buffer size but not that \
