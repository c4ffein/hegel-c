[[target]]
fixed_by = "4f6a6bed0bfe"
title = "mab_calc_split() can leave a deficient right node"
subsystem = "lib/maple_tree"
classes = ["wrong-result"]
provenance = "curated"
tier = "A"
status = "candidate"
fixed = "2024-11-13"
author = "Wei Yang"
source = "git log"
effort = "ready"
mechanism = """mab_calc_split()'s minimum-span loop was passed min = 0 for all \
leaves, never enforced what it claimed, and could leave the right side of a \
split with fewer than mt_min_slots slots: a deficient node, which later \
operations see as a tree-shape violation. The fix removes the loop."""
harness = """snapshot lib/maple_tree.c at 4f6a6bed0bfe~1 (the fix spans several \
functions: no single-line revert) and drive node splits with a stateful \
sequence of insert_range / store / erase"""
property = "mt_validate() passes after every operation"
notes = "A first harness was dropped as false on 2026-10-21; see TODO.md."

[[target]]
fixed_by = "0ea120b278ad"
title = "mas_store_root() NULL store on an empty tree breaks NULL coalescing"
subsystem = "lib/maple_tree"
classes = ["wrong-result"]
provenance = "curated"
tier = "A"
status = "harness-only"
fixed = "2024-10-31"
author = "Wei Yang"
source = "git log"
harness_dir = "tests/irl/linux/maple_store_root"
pin = "tests/irl/linux/pins/maple_store_root.conf"
effort = "ready"
mechanism = """Storing NULL over a range including index 0 of an empty tree \
creates a single-entry node holding NULL; further NULL stores leave \
consecutive NULL slots, against the invariant that adjacent NULLs are \
coalesced. The tree is corrupt, and readers later get wrong values."""
property = "the tree's structural invariants hold (an emptiness check, not just load == model)"
why = "Pure invariant corruption, no crash: a value oracle alone misses it."
notes = "One day before the selection window (2024-11-01); kept as a ready target."

[[target]]
fixed_by = "fba46a5d83ca"
title = "mas_preallocate() keeps MA_STATE_PREALLOC across a second, larger preallocation"
subsystem = "lib/maple_tree"
classes = ["wrong-result"]
provenance = "curated"
tier = "A"
status = "missed"
fixed = "2025-06-16"
author = "Liam R. Howlett"
source = "git log"
harness_dir = "tests/irl/linux/maple_prealloc"
pin = "tests/irl/linux/pins/maple_prealloc.conf"
effort = "small"
mechanism = """mas_preallocate() sets MA_STATE_PREALLOC ("already allocated, \
don't allocate again"). Preallocating the same state twice, the second time \
for a request needing more nodes, short-circuits the second allocation; the \
store then WARN_ONs and dereferences NULL. The fix clears the flag during the \
second preallocation."""
property = "a store after two preallocations doesn't WARN or crash"
why = "A stateful flag bug: what pure generators miss and state machines are for."

[[target]]
fixed_by = "c9ba5249ef8b"
title = "xas_pause() skips indices when pausing inside a multi-index entry"
subsystem = "lib/xarray"
classes = ["wrong-result"]
provenance = "curated"
tier = "A"
status = "harness-only"
fixed = "2024-12-13"
author = "Kemeng Shi"
source = "git log"
harness_dir = "tests/irl/linux/xarray_pause"
pin = "tests/irl/linux/pins/xarray_pause.conf"
effort = "small"
mechanism = """After xas_load() lands on a multi-index entry, the index may point \
mid-entry with bits below node->shift set. xas_pause() advances by \
1 << node->shift without masking them, so it skips past the end of the entry \
and misses the next one (17 + 16 = 33 skips 32). cachestat() returns wrong \
values."""
property = "iterating with pauses visits every index of the entry and the next entry"
why = "Needs a pause mid-entry; pausing only at aligned bases never triggers it."
notes = "Upstream's fix is itself incomplete: finding linux-xas-pause-sibling."

