# Part of hegel-c — see hegel/LICENSE for terms.
#
# Bugs hegel-c found itself, in any project, and where each one stands.
# Rediscoveries of already-fixed bugs live in docs/our_corpus.json instead.
# Bugs others found (Sashiko, by hand) are here when a submission of ours
# fixes them; found_by says who found each one.
#
# View it:   make findings          (terminal)
#            make findings-html     (build/findings.html)
# Check it:  make lint-findings     (fields, statuses, links to files)
#
# This file names bugs: blind bug-hunt sandboxes must never see it
# (scripts/setup-bughunt-sandbox.sh copies an allow-list; keep it off).
#
# Fields (required first):
#   id          project-short-name, stable, kebab-case
#   project     linux | scotch
#   where       file: function
#   title       one line: what goes wrong
#   kind        wrong-result | oob | overflow | null-deref | hang | leak |
#               uaf | crash | contract | api
#   found       YYYY-MM-DD (or YYYY-MM when only the month is known)
#   how         how it surfaced
#   confidence  high | medium | low           (that the bug is real)
#   reach       live | latent | unknown       (can a real caller hit it?)
#   status      suspected | confirmed | patch-ready | reported |
#               fixed-upstream | withdrawn
#   since       date the status last changed
#   source      repo | transcript | memory    (where this entry's facts come
#               from: tracked files, a saved session, or Claude's memory —
#               the last two are unverified until someone re-checks)
# Optional:
#   fixed_by    upstream commit that fixed it
#   introduced  upstream commit that introduced it
#   lore        mailing-list Message-IDs (linux), shown as lore links
#   pin         tests/irl/<project>/pins/<pin>.conf that reproduces it
#   writeup     path to the analysis: docs/findings/<id>.md, or a file in
#               submissions/ or tests/irl/ (lint rejects anywhere else)
#   history     a saved session it comes from (docs/saved_sessions_for_history/)
#   checked     last time someone confirmed it's still upstream, and where
#   found_by    hegel-c | by-hand | sashiko | upstream   (default hegel-c)
#   related     [{ to = "<finding id>", rel = "introduced-by" | "masked-by" |
#               "same-root-cause" | "covered-by" }]
#   notes       anything else
#
# [[submission]] — a patch series or bug report we sent (or drafted) upstream.
# One submission can fix several findings; one finding can have several.
#   id, project, title
#   kind        patch | report
#   fixes       [finding ids]
#   state       planned | draft | sent | changes-requested | applied |
#               merged | abandoned | superseded
#               (planned = we will send it, nothing written yet: no versions)
#               (applied = in the maintainer's tree; merged = upstream proper)
#   since       date the state last changed
#   versions    [{ v, label, sent | built (date), patches, lore (Message-ID), to }]
#               label tells apart two candidates with the same number (v3 ours
#               and v3 agent); a version's folder is dir/v<N>[-<label>]
#   next        what we do next (required while draft or changes-requested;
#               the page lists these first, under "to do")
#   commit      upstream commit that merged it (state merged)
#   dir         submissions/<id>: one folder per version holding the patches
#               exactly as sent / to be sent, plus notes (cover letters, send
#               steps, reports); see submissions/README.md
#               An unsent version's folder may stay out of git until it goes
#               out: lint skips it when absent, and links into it (dir,
#               writeup) say so with a trailing " (not in git)".
#   notes
# lint keeps both sides in step: a finding fixed by a merged submission must
# be fixed-upstream, one fixed only by a draft must be patch-ready. It also
# checks every version folder against its entry (patch count, [PATCH vN i/n]
# numbering, a cover letter for Linux series, Signed-off-by on sent Linux
# patches) and that every folder under submissions/ is in this file.

# ---------------------------------------------------------------- linux ----

[[finding]]
id = "linux-sg-split-overshoot"
project = "linux"
where = "lib/scatterlist.c: sg_calculate_split()"
title = "nb_splits is decremented twice per pass but the loop stops only at exactly 0, so the last split swallows the next input entry"
kind = "wrong-result"
found = "2026-05-25"
how = "blind rediscovery hunt, by accident (while hunting 8b46fdaea819)"
confidence = "high"
reach = "latent"
status = "reported"
since = "2026-06-10"
pin = "tests/irl/linux/pins/sg_split.conf"
writeup = "docs/findings/linux-sg-split-overshoot.md"
checked = "2026-10-22: present in v7.3 and linux-next"
source = "repo"
found_by = "hegel-c"
notes = "Patch 1/5 of the series (see linux-sg-split-series). Prior art: Egorenkov 2021, never merged; our fix (nb_splits <= 0) passes the edge-aligned case his breaks. No in-tree caller triggers it."

