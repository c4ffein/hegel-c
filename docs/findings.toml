[[finding]]
id = "linux-sg-split-zero-size-silent"
project = "linux"
where = "lib/scatterlist.c: sg_calculate_split()"
title = "a zero size reached exactly when the input runs out returns success and silently drops every later size"
kind = "wrong-result"
found = "2026-07-05"
how = "Sashiko's review of v2 (a pre-existing High finding); then found independently by a new hegel-c contract property, shrunk to in=[1], skip=0, sizes={1,0,1}"
confidence = "high"
reach = "latent"
status = "patch-ready"
since = "2026-07-06"
source = "memory"
found_by = "sashiko"
related = [{ to = "linux-sg-split-zero-nents", rel = "masked-by" }]
notes = "Before the zero-nents guard every input that hits it also crashed, so the wrong rc=0 was hidden; v2's guard alone would have made it silent. Our v3 rejects zero sizes with -EINVAL, which fixes both; the v3-agent variant rejects only past-the-end requests and gives a zero-size split at the end one empty entry (decision D1). Generator lesson: the old property excluded zeros and over-requests by construction, and a uniform draw found nothing in 500 cases."

