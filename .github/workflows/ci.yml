name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The engine (libhegel.so) version is not set here: the `engine` job builds
# whatever deps/hegel is checked out at, which the release watch keeps on
# the Makefile's LIBHEGEL_VERSION tag (see CLAUDE.md, "libhegel").

jobs:
  # Build the engine cdylib (libhegel.so) from source once and share it.
  # This is the only job that needs cargo + the engine source; every
  # other job consumes the resulting .so.  The pure-C libhegel_c.a is
  # fast to rebuild per-job (via `make lib`), so it is not shared.
  engine:
    name: Build engine (libhegel.so)
    runs-on: ubuntu-latest
    steps:
      # deps/hegel (the hegeldev/hegel monorepo) is a submodule pinned to the engine version the
      # runtime is verified against; checking it out here is the pin.
      # (The other jobs skip submodules — they only need the built .so.)
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      # Cache the cargo registry/git downloads only — NOT target/.  A
      # cached target/ carries cargo fingerprints; if the emitted
      # libhegel.so is not in the restore, cargo prints "Finished"
      # without re-emitting it and the build has no artifact to copy.
      # The compile is ~30s, so caching target/ is not worth that trap.
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('deps/hegel/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-

      - name: Build engine
        run: make libhegel

      - name: Upload engine
        uses: actions/upload-artifact@v6
        with:
          name: libhegel-so
          # The tagged build (libhegel-<version>-source.so); the jobs that
          # download it run `make libhegel`, which keeps it (no cargo, no
          # submodule there) and points build/libhegel.so at it.
          path: build/libhegel-*-source.so
          if-no-files-found: error

  # The run log, the rediscovery corpus and the pins' bug references
  # (docs/runs.toml, docs/corpus.toml, PIN_BUG): fields, verdicts, files,
  # bugs:<uuid> form.  The bugs themselves are in c4ffein/bugs (private, not
  # checked out here).  Python 3.11+ standard library only; no engine needed.
  runs:
    name: Runs + corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint runs, corpus and pins
        run: make lint-runs

  # The documents against the sources: code snippets in docs/*.md are the
  # lines of the files they name, and the test counts README.md and
  # CLAUDE.md state are the suites' (the TESTS_* lists of the test
  # Makefiles, tests/irl/scotch/props/, the Scotch pin `current`).  Python
  # standard library only; nothing is built.
  docs:
    name: Docs match sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check snippets and test counts
        run: make docs-check

  # Per-file licensing (REUSE.toml + LICENSES/): every file has its license,
  # no license text is unused, third-party excerpts keep theirs.  Same check
  # as `make check-reuse`; the submodule is not checked out, so deps/hegel is
  # not linted (it has its own licensing).
  reuse:
    name: REUSE licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: reuse lint
        uses: fsfe/reuse-action@v6

  selftest:
    name: Selftest suite
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download engine
        uses: actions/download-artifact@v7
        with:
          name: libhegel-so
          path: build/

      # `make selftest-test` self-delegates to `make lib libhegel`:
      # the downloaded tagged engine is kept and linked as
      # build/libhegel.so, libhegel_c.a is rebuilt from C with the
      # preinstalled GCC.
      - name: Run selftest suite
        run: make selftest-test

  from-hegel-rust:
    name: From-hegel-rust suite
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download engine
        uses: actions/download-artifact@v7
        with:
          name: libhegel-so
          path: build/

      - name: Run from-hegel-rust suite
        run: make from-hegel-rust-test

  mpi:
    name: MPI tests (Debian 13 / OpenMPI 5)
    needs: engine
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y gcc make openmpi-bin libopenmpi-dev

      - name: Download engine
        uses: actions/download-artifact@v7
        with:
          name: libhegel-so
          path: build/

      - name: Run MPI tests
        run: |
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          export PRTE_ALLOW_RUN_AS_ROOT=1
          export PRTE_ALLOW_RUN_AS_ROOT_CONFIRM=1
          make mpi-test

  scotch:
    name: Scotch integration tests (Debian 13 / OpenMPI 5)
    needs: engine
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y gcc make libscotch-dev libptscotch-dev openmpi-bin libopenmpi-dev

      - name: Download engine
        uses: actions/download-artifact@v7
        with:
          name: libhegel-so
          path: build/

      - name: Run Scotch integration tests
        run: |
          export OMPI_ALLOW_RUN_AS_ROOT=1
          export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
          export PRTE_ALLOW_RUN_AS_ROOT=1
          export PRTE_ALLOW_RUN_AS_ROOT_CONFIRM=1
          make scotch-test-deb
